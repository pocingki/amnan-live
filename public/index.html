<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Lead Tracker Gateway</title>
    <link id="brand-icon" rel="icon" href="/brand/favicon">
    <!-- CSP (K3): tanpa script inline, tanpa CDN. Tailwind dibangun ke assets/css/tailwind.css (palet brand K8). -->
    <link rel="stylesheet" href="/assets/css/tailwind.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <!-- Warna brand per client (menimpa variabel warna di atas); diubah dari Pengaturan -->
    <link id="brand-css" rel="stylesheet" href="/brand.css">
</head>
<body class="bg-white text-gray-800 font-sans min-h-screen flex flex-col">
    <a href="#view" class="skip-link" id="skip-link">Lewati ke konten utama</a>
    <noscript><p class="p-4 text-center text-red-700">Dashboard ini membutuhkan JavaScript. Aktifkan JavaScript di browser Anda.</p></noscript>

    <!-- LOGO BRAND | MENU (TENGAH) | STATUS WA + NOTIFIKASI + AKUN (KANAN ATAS) -->
    <header class="bg-white border-t-4 border-brand-800 border-b border-b-gray-200 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="app-header-row grid items-center gap-x-3 py-2 md:py-0">

                <a href="#/crm" class="flex items-center gap-3 min-w-0" aria-label="Ke halaman CRM" id="brand-link">
                    <!-- Logo diunggah dari Pengaturan (disimpan di data/brand); jika belum ada, tampil ikon favicon (diatur app.js) -->
                    <img id="brand-logo" src="" alt="" class="h-9 w-auto object-contain shrink-0" hidden>
                    <img id="brand-mark" src="/brand/favicon" alt="" class="h-9 w-9 object-contain shrink-0">
                    <div class="leading-tight min-w-0">
                        <div id="brand-name" class="text-xl font-extrabold tracking-tight text-brand-800"></div>
                        <div id="brand-tagline" class="hidden lg:block text-[11px] text-gray-600"></div>
                    </div>
                </a>

                <nav id="nav" aria-label="Menu utama" class="order-last col-span-3 md:order-none md:col-span-1 flex items-center gap-1 overflow-x-auto min-w-0 text-sm font-medium">
                    <a href="#/pesan" data-r="/pesan" class="nav-link">Pesan</a>
                    <a href="#/percakapan" data-r="/percakapan" class="nav-link">Percakapan Masuk<span class="nav-unread nav-badge" hidden></span></a>
                    <a href="#/crm" data-r="/crm" class="nav-link">CRM</a>
                    <a href="#/bot-tester" data-r="/bot-tester" class="nav-link">Bot Tester</a>
                    <a href="#/integrasi" data-r="/integrasi" class="nav-link">Integrasi</a>
                    <a href="#/pengaturan" data-r="/pengaturan" class="nav-link">Pengaturan</a>
                </nav>

                <div class="app-header-tools flex items-center justify-end gap-2 sm:gap-3 min-w-0">
                    <!-- Status WA: terlihat juga di HP. Status = ikon + teks (bukan hanya warna). -->
                    <div id="wa-badge" class="wa-badge wa-warn" role="status" aria-label="Status WhatsApp: memeriksa">
                        <span id="wa-icon" aria-hidden="true"></span>
                        <span id="wa-long" class="wa-long" aria-hidden="true">Memeriksa status WA…</span>
                        <span id="wa-short" class="wa-short" aria-hidden="true">WA…</span>
                    </div>

                    <button id="bell-btn" type="button" class="icon-btn shrink-0" aria-label="Pengaturan notifikasi" title="Notifikasi" aria-haspopup="menu" aria-expanded="false"></button>

                    <!-- Akun: lingkaran di pojok kanan atas -->
                    <div class="relative">
                        <button id="avatar-btn" type="button" aria-label="Akun" title="Akun" aria-haspopup="true" aria-expanded="false" aria-controls="avatar-menu"
                                class="h-10 w-10 shrink-0 rounded-full bg-brand-800 text-white flex items-center justify-center ring-2 ring-brand-100 hover:bg-brand-900">
                            <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
                        </button>
                        <div id="avatar-menu" class="avatar-menu" hidden>
                            <div class="px-4 py-3 border-b border-gray-100">
                                <div class="text-xs text-gray-600">Masuk sebagai</div>
                                <div id="me-name" class="font-semibold text-brand-800 truncate">…</div>
                                <div class="text-xs text-gray-600 mt-0.5">Peran: <span id="me-role">…</span></div>
                            </div>
                            <a href="/login" class="block px-4 py-2 hover:bg-brand-50">Masuk (ganti akun)</a>
                            <button id="btn-signout" type="button" class="block w-full text-left px-4 py-2 text-red-700 hover:bg-red-50">Keluar</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main id="view" tabindex="-1" class="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8" aria-live="off"></main>

    <!-- FOOTER -->
    <footer class="border-t border-gray-200 bg-white py-4 text-center text-xs text-gray-600">
        &copy; <span id="year"></span> <span id="foot-brand" class="font-semibold text-brand-800"></span> &middot; Lead Tracker Gateway
    </footer>

    <!-- Menu bawah tampil di lebar ponsel (≤760px), sama seperti Acesio. Desktop tetap memakai nav di header. -->
    <nav id="os-tabbar" class="os-tabbar" aria-label="Menu utama">
        <a href="#/pesan" data-r="/pesan" class="nav-link" title="Pesan"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h16"/></svg><span>Pesan</span></a>
        <a href="#/percakapan" data-r="/percakapan" class="nav-link" title="Percakapan Masuk"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14v9H8l-3 3V6z"/></svg><span>Chat</span><span class="nav-unread nav-badge" hidden></span></a>
        <a href="#/crm" data-r="/crm" class="nav-link" title="CRM"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5M4 19h16M8 16v-5M12 16V8M16 16v-3"/></svg><span>CRM</span></a>
        <a href="#/bot-tester" data-r="/bot-tester" class="nav-link" title="Bot Tester"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="8" width="10" height="8" rx="2"/><path d="M12 8V5M9 13h.01M15 13h.01"/></svg><span>Tester</span></a>
        <a href="#/integrasi" data-r="/integrasi" class="nav-link" title="Integrasi"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 12h8M7 8H5v8h2M17 8h2v8h-2"/></svg><span>Integrasi</span></a>
        <a href="#/pengaturan" data-r="/pengaturan" class="nav-link" title="Pengaturan"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></svg><span>Atur</span></a>
    </nav>

    <div id="toast-host" class="toast-host" aria-live="polite"></div>
    <div id="route-announcer" class="sr-only" role="status" aria-live="polite"></div>

    <script type="module" src="assets/js/app.js"></script>
</body>
</html>
